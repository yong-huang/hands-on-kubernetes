# ============================================================
# Pod 基础示例：单容器 / 多容器 sidecar / initContainer / 探针
# 使用方式: kubectl apply -f pod.yaml
# 清理方式: kubectl delete -f pod.yaml
# ============================================================

# ---------- 示例 1: 最简单的 nginx Pod ----------
# Pod 是 K8s 最小调度单元，一个 Pod 可以包含 1 个或多个容器
apiVersion: v1
kind: Pod
metadata:
  name: nginx-pod                    # Pod 名字，namespace 内唯一
  labels:                            # 标签：用于 Selector 筛选，是 Service/Deployment 找到 Pod 的关键
    app: nginx
    tier: frontend
spec:
  containers:                        # 业务容器列表（可多个）
    - name: nginx                    # 容器名，Pod 内唯一（docker run --name）
      image: nginx:1.27              # 镜像，建议固定版本号而不用 latest
      ports:
        - containerPort: 80          # 声明容器监听端口（仅文档作用，不映射也会通）
      resources:                     # 资源配置：requests 影响调度，limits 触发 throttling/OOMKill
        requests:                    # 调度依据：调度器保证节点至少有这么多可用资源
          cpu: 100m                  # 100m = 0.1 核
          memory: 128Mi
        limits:                      # 上限：内存超限 → OOMKilled；CPU 超限 → 限流（不会被杀）
          cpu: 250m
          memory: 256Mi

---
# ---------- 示例 2: 多容器 Pod（sidecar 模式）----------
# nginx 写日志，busybox sidecar 实时读取 —— 两个容器通过 emptyDir 共享目录
# sidecar 与主容器同生共死：同时创建、同时调度到同一节点、共享网络命名空间
apiVersion: v1
kind: Pod
metadata:
  name: nginx-sidecar-pod
  labels:
    app: nginx
    tier: frontend
    pattern: sidecar
spec:
  volumes:                           # 卷定义在 Pod 层级，容器里通过 name 挂载
    - name: shared-logs              # 共享卷名
      emptyDir: {}                   # emptyDir：Pod 生命周期内的临时目录，Pod 删除即消失
  containers:
    - name: nginx                    # 主容器：业务本体
      image: nginx:1.27
      volumeMounts:
        - name: shared-logs          # 引用上面定义的卷
          mountPath: /var/log/nginx  # nginx 日志默认目录
    - name: log-tailer               # sidecar 容器：增强主容器，不影响业务逻辑
      image: busybox:1.36
      command: ["/bin/sh", "-c"]     # 覆盖镜像默认入口
      args:
        - tail -f /var/log/nginx/access.log   # 持续读共享卷上的日志
      volumeMounts:
        - name: shared-logs          # 挂同一个卷 → 与 nginx 看到同一份文件
          mountPath: /var/log/nginx

---
# ---------- 示例 3: initContainer 等待依赖服务就绪 ----------
# initContainer 串行执行，全部成功退出(exit 0)后才会启动业务容器
# 适合做：等待依赖、初始化配置文件、下载模型、注册中心注册等一次性工作
apiVersion: v1
kind: Pod
metadata:
  name: init-demo-pod
  labels:
    app: init-demo
spec:
  volumes:
    - name: workdir
      emptyDir: {}
  initContainers:                    # 初始化容器列表：按顺序逐个执行
    - name: wait-for-service         # 反复探测依赖服务，直到可连接
      image: busybox:1.36
      command:
        - sh
        - -c
        # 注意: DNS 只为 Service 建 A 记录, Pod 名字没有 DNS 记录!
        # 这里等待集群自带的 kubernetes Service (任何集群都存在, 演示自包含)
        - until nslookup kubernetes.default.svc.cluster.local; do echo waiting for kubernetes svc; sleep 2; done
    - name: install-tool             # 第二个 initContainer：往共享卷写入初始文件
      image: busybox:1.36
      command: ["sh", "-c", "echo 'init done' > /work/index.html"]
      volumeMounts:
        - name: workdir
          mountPath: /work
  containers:
    - name: main
      image: busybox:1.36
      command: ["sh", "-c", "cat /work/index.html && sleep 3600"]
      volumeMounts:
        - name: workdir              # 业务容器读取 initContainer 准备好的数据
          mountPath: /work

---
# ---------- 示例 4: liveness / readiness / startup 探针 ----------
# liveness  失败 → 重启容器（治"卡死"）
# readiness 失败 → 摘除 Service 流量（治"没准备好"）
# startup   成功前屏蔽上面两个探针（治"启动慢被误杀"）
apiVersion: v1
kind: Pod
metadata:
  name: probe-demo-pod
  labels:
    app: probe-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      startupProbe:                  # 启动探针：先等它成功，才启用下面两个探针
        httpGet:
          path: /                    # HTTP GET http://podIP:80/
          port: 80
        failureThreshold: 30         # 最多允许失败 30 次
        periodSeconds: 2             # 每 2s 探一次 → 最长容忍 60s 启动时间
      livenessProbe:                 # 存活探针：失败则 kubelet 重启容器
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5       # 容器启动后等 5s 才开始探（有 startupProbe 时可省）
        periodSeconds: 5             # 探测间隔
        timeoutSeconds: 2            # 单次探测超时
        failureThreshold: 3          # 连续失败 3 次才判定失败
      readinessProbe:                # 就绪探针：失败仅从 Service endpoints 摘除，不重启
        httpGet:
          path: /
          port: 80
        periodSeconds: 5
        failureThreshold: 3
