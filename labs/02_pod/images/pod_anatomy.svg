<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#326ce5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2da44e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
<rect width="720" height="620" fill="#ffffff"/>
<text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">Pod 内部解剖：pause 底座与多容器协作</text>
<!-- ==================== 左侧：Pod 内部解剖 ==================== -->

  <!-- Pod boundary -->
  <rect x="60" y="95" width="560" height="250" rx="14" fill="#eff5ff" stroke="#326ce5" stroke-width="1.8"/>
  <rect x="60" y="95" width="560" height="30" rx="14" fill="#326ce5"/>
  <rect x="60" y="112" width="560" height="13" fill="#326ce5"/>
  <text x="76" y="115" font-size="13" font-weight="700" fill="#ffffff">Pod · nginx-sidecar-pod</text>
  <rect x="452" y="101" width="156" height="18" rx="9" fill="#ffffff" opacity="0.22"/>
  <text x="530" y="114" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">同生共死 · 同节点 · 1 个 IP</text>

  <!-- pause container -->
  <rect x="80" y="137" width="520" height="32" rx="6" fill="#eaeef2" stroke="#8b949e" stroke-width="1.2"/>
  <text x="340" y="157" font-size="10.5" fill="#1f2328" text-anchor="middle">pause 容器（infrastructure）：持有网络 + IPC 命名空间，最先启动，几乎零资源</text>

  <!-- main container -->
  <rect x="80" y="182" width="250" height="104" rx="8" fill="#ffffff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="92" y="202" font-size="12" font-weight="700" fill="#1f2328">nginx（主容器）</text>
  <text x="92" y="221" font-size="9.5" fill="#57606a">image: nginx:1.27 · HTTP :80</text>
  <text x="92" y="238" font-size="9.5" fill="#57606a">写访问日志 → /var/log/nginx/</text>
  <text x="92" y="255" font-size="9.5" fill="#57606a">resources: requests 影响调度</text>
  <text x="92" y="272" font-size="9.5" fill="#57606a">limits 超内存 → OOMKilled</text>

  <!-- sidecar container -->
  <rect x="350" y="182" width="250" height="104" rx="8" fill="#ffffff" stroke="#2da44e" stroke-width="1.5"/>
  <text x="362" y="202" font-size="12" font-weight="700" fill="#1a7f37">log-tailer（sidecar）</text>
  <text x="362" y="221" font-size="9.5" fill="#57606a">image: busybox:1.36</text>
  <text x="362" y="238" font-size="9.5" fill="#57606a">tail -f 实时读共享卷上的日志</text>
  <text x="362" y="255" font-size="9.5" fill="#57606a">与主容器并行 · 长期运行</text>
  <text x="362" y="272" font-size="9.5" fill="#57606a">增强主容器，不改业务代码</text>

  <!-- mount arrows to shared volume -->
  <path d="M 205 286 L 205 298" fill="none" stroke="#d4a72c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 475 286 L 475 298" fill="none" stroke="#d4a72c" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- shared volume -->
  <rect x="80" y="303" width="520" height="30" rx="6" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="340" y="322" font-size="10.5" fill="#7d4e00" text-anchor="middle">emptyDir 卷 shared-logs —— 两容器同挂 /var/log/nginx，Pod 删除即消失</text>

  <!-- initContainer strip -->
  <rect x="60" y="375" width="170" height="56" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.3"/>
  <text x="145" y="397" font-size="10.5" font-weight="700" fill="#1f2328" text-anchor="middle">init ① wait-for-service</text>
  <text x="145" y="415" font-size="9" fill="#57606a" text-anchor="middle">nslookup 轮询等 Service 就绪</text>
  <path d="M 232 403 L 256 403" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="244" y="395" font-size="8.5" fill="#57606a" text-anchor="middle">exit 0</text>
  <rect x="260" y="375" width="170" height="56" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.3"/>
  <text x="345" y="397" font-size="10.5" font-weight="700" fill="#1f2328" text-anchor="middle">init ② install-tool</text>
  <text x="345" y="415" font-size="9" fill="#57606a" text-anchor="middle">写 /work/index.html</text>
  <path d="M 432 403 L 456 403" fill="none" stroke="#57606a" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="444" y="395" font-size="8.5" fill="#57606a" text-anchor="middle">exit 0</text>
  <rect x="460" y="375" width="160" height="56" rx="8" fill="#eff5ff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="540" y="397" font-size="10.5" font-weight="700" fill="#1f2328" text-anchor="middle">业务容器启动</text>
  <text x="540" y="415" font-size="9" fill="#57606a" text-anchor="middle">读取 init 准备好的数据</text>
  <text x="60" y="452" font-size="9.5" fill="#57606a">initContainer：串行、必须 exit 0 才继续；sidecar：并行、长期运行 —— 附加容器的两种时机</text>

  <!-- left note box -->
  <rect x="60" y="470" width="560" height="85" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="492" font-size="10.5" fill="#1f2328">‣ 同 Pod 容器共享一个 Pod IP：localhost 互访、端口不能冲突；主容器重启 IP 不变</text>
  <text x="76" y="511" font-size="10.5" fill="#1f2328">‣ 节点上 docker ps 比 kubectl get pods 多一个容器 —— 那就是 pause</text>
  <text x="76" y="530" font-size="10.5" fill="#1f2328">‣ labels 是 Service / Deployment 找到 Pod 的唯一线索（selector 匹配）</text>
<text x="40" y="592" font-size="10.5" fill="#57606a">心智模型：pause 提供底座，sidecar / initContainer 扩展能力边界，探针（见下图）赋予自愈与流量治理。</text>
</svg>
