apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kustomize-demo
resources:
  - ../../base
  - namespace.yaml
labels:
  - pairs:
      environment: staging
    includeSelectors: true   # 把新标签并进 selector——两个 overlay 的 Deployment 互不认领对方的 Pod
images:
  - name: nginx
    newTag: "1.27"
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
configMapGenerator:
  - name: web-config
    behavior: replace
    files:
      - default.conf
