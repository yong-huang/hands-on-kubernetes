# =============================================================================
# Vault + Secrets Store CSI Driver 动态凭证注入
# 流程: Pod 挂载 CSI 卷 -> CSI Driver 用 SA Token 向 Vault 认证(K8s auth)
#       -> Vault 动态生成数据库凭证(TTL 1h) -> 以文件形式挂进容器
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: vault-demo
---
# 1. Vault 连接配置 (SecretProviderClass: 告诉 CSI 驱动去哪取什么)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: vault-db-creds
  namespace: vault-demo
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault.vault.svc.cluster.local:8200"
    roleName: "demo-app"                       # 对应 Vault K8s auth role
    objects: |
      - objectName: "username"
        secretPath: "database/creds/demo-app"  # 动态引擎路径(每次挂载生成新凭证)
        secretKey: "username"
      - objectName: "password"
        secretPath: "database/creds/demo-app"
        secretKey: "password"
  secretObjects:                               # 同时同步为原生 K8s Secret(供 env 引用)
    - secretName: db-creds-synced
      type: Opaque
      labels: {app: demo-app}
      data:
        - {objectName: username, key: db_user}
        - {objectName: password, key: db_pass}
---
# 2. 使用动态凭证的应用 Pod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: vault-demo
spec:
  replicas: 1
  selector: {matchLabels: {app: demo-app}}
  template:
    metadata:
      labels: {app: demo-app}
    spec:
      serviceAccountName: demo-app              # Vault K8s auth 的身份
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c",
                    "while true; do echo 'cred file:'; cat /mnt/secrets/username 2>/dev/null && echo; sleep 30; done"]
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true                 # vault-csi-provider 要求卷只读
            volumeAttributes:              # Pod 的 CSI 卷字段名是 volumeAttributes
              secretProviderClass: vault-db-creds   # 驱动要求的键不带 Name 后缀
---
# 3. (对照) 传统方式: 静态 Secret —— 明文存 etcd, 泄漏面大
apiVersion: v1
kind: Secret
metadata:
  name: static-db-cred
  namespace: vault-demo
type: Opaque
stringData:
  password: "super-secret-do-not-commit"   # 反面教材: 会进 Git/etcd 备份
---
# 4. 演示用 PostgreSQL: 动态引擎的"被管理方", Vault 用管理员账号
#    连上来现场 CREATE ROLE / DROP ROLE (生产中应换成独立 DB 实例)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: vault-demo
  labels: {tier: database}
spec:
  replicas: 1
  selector: {matchLabels: {tier: database}}
  template:
    metadata:
      labels: {tier: database}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_DB, value: "app"}
            - {name: POSTGRES_USER, value: "vaultadmin"}       # Vault 引擎的管理员账号
            - {name: POSTGRES_PASSWORD, value: "vaultadminpass"}
          ports:
            - {containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "vaultadmin", "-d", "app"]}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vault-demo
spec:
  selector: {tier: database}
  ports:
    - {port: 5432, targetPort: 5432}
