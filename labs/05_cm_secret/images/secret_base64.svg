<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="840" height="500" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">Secret 存储链路：base64 是编码，不是加密</text>

  <!-- flow -->
  <rect x="40" y="100" width="165" height="90" rx="10" fill="#eff5ff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="56" y="126" font-size="11" font-weight="700" fill="#326ce5">你写 YAML</text>
  <text x="56" y="148" font-size="9.5" fill="#1f2328">stringData:</text>
  <text x="56" y="166" font-size="9.5" fill="#57606a">P@ssw0rd-123（明文）</text>

  <line x1="205" y1="145" x2="241" y2="145" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="245" y="100" width="165" height="90" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="261" y="126" font-size="11" font-weight="700" fill="#1f2328">API Server</text>
  <text x="261" y="148" font-size="9.5" fill="#57606a">自动 base64 编码</text>
  <text x="261" y="166" font-size="9.5" fill="#57606a">转存为 data 字段</text>

  <line x1="410" y1="145" x2="446" y2="145" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="450" y="100" width="165" height="90" rx="10" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.5"/>
  <text x="466" y="126" font-size="11" font-weight="700" fill="#7d4e00">etcd 落盘</text>
  <text x="466" y="148" font-size="9.5" fill="#1f2328">UEBzc3cwcmQtMTIz</text>
  <text x="466" y="166" font-size="9.5" fill="#57606a">默认就是 base64 裸奔</text>

  <line x1="615" y1="145" x2="651" y2="145" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="655" y="100" width="165" height="90" rx="10" fill="#f0fff4" stroke="#2da44e" stroke-width="1.5"/>
  <text x="671" y="126" font-size="11" font-weight="700" fill="#1a7f37">消费端</text>
  <text x="671" y="148" font-size="9.5" fill="#57606a">env / volume 注入时</text>
  <text x="671" y="166" font-size="9.5" fill="#57606a">自动解码为明文</text>

  <!-- warning band -->
  <rect x="40" y="230" width="780" height="70" rx="8" fill="#fff1f0" stroke="#cf222e" stroke-width="1.6"/>
  <text x="56" y="258" font-size="12.5" font-weight="700" fill="#cf222e">base64 ≠ 加密 —— 一条命令还原明文</text>
  <text x="56" y="282" font-size="10.5" fill="#a40e26">echo 'UEBzc3cwcmQtMTIz' | base64 -d   →   P@ssw0rd-123（任何人都能解）</text>

  <!-- security stack -->
  <text x="40" y="336" font-size="10.5" fill="#57606a">真正的安全来自配套设施：</text>
  <g font-size="10.5" font-weight="700">
    <rect x="40" y="348" width="180" height="80" rx="8" fill="#eff5ff" stroke="#326ce5" stroke-width="1.3"/>
    <text x="56" y="372" fill="#1f2328">etcd 静态加密</text>
    <rect x="56" y="382" width="148" height="20" rx="4" fill="#ffffff" stroke="#a5c2ff"/>
    <text x="130" y="396" font-size="8" font-weight="400" fill="#1f2328" text-anchor="middle">EncryptionConfiguration</text>
    <text x="56" y="418" font-size="9" font-weight="400" fill="#57606a">落盘前再加密一层</text>

    <rect x="235" y="348" width="180" height="80" rx="8" fill="#f0fff4" stroke="#2da44e" stroke-width="1.3"/>
    <text x="251" y="372" fill="#1f2328">RBAC 最小授权</text>
    <text x="251" y="394" font-size="9" font-weight="400" fill="#57606a">secrets 是独立资源类型</text>
    <text x="251" y="412" font-size="9" font-weight="400" fill="#57606a">细粒度控制 get 权限</text>

    <rect x="430" y="348" width="180" height="80" rx="8" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.3"/>
    <text x="446" y="372" fill="#1f2328">审计日志</text>
    <text x="446" y="394" font-size="9" font-weight="400" fill="#57606a">谁在何时读了哪个</text>
    <text x="446" y="412" font-size="9" font-weight="400" fill="#57606a">Secret，有迹可循</text>

    <rect x="625" y="348" width="180" height="80" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.3"/>
    <text x="641" y="372" fill="#1f2328">不进镜像层</text>
    <text x="641" y="394" font-size="9" font-weight="400" fill="#57606a">密码永不写入镜像，</text>
    <text x="641" y="412" font-size="9" font-weight="400" fill="#57606a">docker history 无泄露</text>
  </g>

  <text x="40" y="470" font-size="10.5" fill="#1f2328">同一镜像 × 不同 ConfigMap/Secret = dev / staging / prod —— 12-Factor：配置存于环境，不进镜像。</text>
</svg>
