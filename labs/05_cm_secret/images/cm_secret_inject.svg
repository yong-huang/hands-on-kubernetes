<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" viewBox="0 0 840 620" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="840" height="620" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">ConfigMap / Secret 的四种注入方式</text>

  <!-- Pod boundary -->
  <rect x="290" y="96" width="280" height="344" rx="12" fill="#eff5ff" stroke="#326ce5" stroke-width="1.8"/>
  <rect x="290" y="96" width="280" height="28" rx="12" fill="#326ce5"/>
  <rect x="290" y="112" width="280" height="12" fill="#326ce5"/>
  <text x="306" y="115" font-size="12.5" font-weight="700" fill="#ffffff">Pod · app-pod</text>

  <rect x="306" y="134" width="248" height="292" rx="8" fill="#ffffff" stroke="#8b949e" stroke-width="1.4"/>
  <text x="316" y="152" font-size="10" fill="#57606a">container · busybox</text>

  <!-- env chips -->
  <rect x="316" y="162" width="116" height="26" rx="6" fill="#eff5ff" stroke="#a5c2ff"/>
  <text x="374" y="179" font-size="9" fill="#1f2328" text-anchor="middle">LOG_LEVEL=info</text>
  <rect x="440" y="162" width="106" height="26" rx="6" fill="#fff1f0" stroke="#e2a0a6"/>
  <text x="493" y="179" font-size="9" fill="#a40e26" text-anchor="middle">DB_PASSWORD=…</text>

  <!-- mount dir 1 -->
  <rect x="316" y="204" width="228" height="76" rx="8" fill="#f8fbff" stroke="#326ce5" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="328" y="224" font-size="10" font-weight="700" fill="#326ce5">/etc/config/（ConfigMap 卷）</text>
  <rect x="330" y="234" width="120" height="24" rx="5" fill="#ffffff" stroke="#a5c2ff"/>
  <text x="390" y="250" font-size="9.5" fill="#1f2328" text-anchor="middle">app.conf</text>
  <text x="462" y="250" font-size="8.5" fill="#57606a">键名 = 文件名</text>

  <!-- mount dir 2 -->
  <rect x="316" y="296" width="228" height="76" rx="8" fill="#fffafa" stroke="#cf222e" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="328" y="316" font-size="10" font-weight="700" fill="#cf222e">/etc/secret/（Secret 卷）</text>
  <rect x="330" y="326" width="104" height="22" rx="5" fill="#ffffff" stroke="#e2a0a6"/>
  <text x="382" y="341" font-size="9" fill="#1f2328" text-anchor="middle">DB_USERNAME</text>
  <rect x="442" y="326" width="104" height="22" rx="5" fill="#ffffff" stroke="#e2a0a6"/>
  <text x="494" y="341" font-size="9" fill="#1f2328" text-anchor="middle">DB_PASSWORD</text>
  <text x="328" y="364" font-size="8.5" fill="#57606a">defaultMode: 0400 · 内容是解码后的明文</text>

  <!-- left ConfigMap boxes -->
  <rect x="40" y="120" width="210" height="86" rx="10" fill="#eff5ff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="54" y="142" font-size="11" font-weight="700" fill="#326ce5">ConfigMap · app-config</text>
  <text x="54" y="162" font-size="9.5" fill="#1f2328">LOG_LEVEL: "info"</text>
  <text x="54" y="179" font-size="9.5" fill="#57606a">MAX_CONNECTIONS: "100"</text>
  <text x="54" y="196" font-size="9.5" fill="#57606a">APP_MODE: "production"</text>

  <rect x="40" y="300" width="210" height="86" rx="10" fill="#eff5ff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="54" y="322" font-size="11" font-weight="700" fill="#326ce5">ConfigMap · app-file-config</text>
  <text x="54" y="342" font-size="9.5" fill="#1f2328">app.conf: |</text>
  <text x="54" y="359" font-size="9.5" fill="#57606a">timeout = 30 · retries = 3</text>
  <text x="54" y="376" font-size="8.5" fill="#8b949e">也可 kubectl create cm --from-file</text>

  <!-- right Secret boxes -->
  <rect x="590" y="120" width="210" height="86" rx="10" fill="#fff1f0" stroke="#cf222e" stroke-width="1.5"/>
  <text x="604" y="142" font-size="11" font-weight="700" fill="#cf222e">Secret · db-secret</text>
  <text x="604" y="162" font-size="9.5" fill="#1f2328">type: Opaque</text>
  <text x="604" y="179" font-size="9.5" fill="#57606a">stringData:（写明文即可）</text>
  <text x="604" y="196" font-size="9.5" fill="#57606a">DB_PASSWORD: "P@ssw0rd-123"</text>

  <rect x="590" y="300" width="210" height="86" rx="10" fill="#fff1f0" stroke="#cf222e" stroke-width="1.5"/>
  <text x="604" y="322" font-size="11" font-weight="700" fill="#cf222e">Secret 卷挂载</text>
  <text x="604" y="342" font-size="9.5" fill="#1f2328">secretName: db-secret</text>
  <text x="604" y="359" font-size="9.5" fill="#57606a">defaultMode: 0400（密码文件收紧）</text>
  <text x="604" y="376" font-size="8.5" fill="#8b949e">每个键一个文件，自动解码</text>

  <!-- inject arrows with numbered badges -->
  <path d="M 250 150 C 285 150, 292 170, 312 174" fill="none" stroke="#326ce5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="280" cy="152" r="9" fill="#326ce5"/>
  <text x="280" y="156" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">①</text>

  <path d="M 250 330 C 292 330, 286 250, 314 243" fill="none" stroke="#326ce5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="282" cy="296" r="9" fill="#326ce5"/>
  <text x="282" y="300" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">②</text>

  <path d="M 590 150 C 560 150, 556 170, 548 174" fill="none" stroke="#cf222e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="568" cy="152" r="9" fill="#cf222e"/>
  <text x="568" y="156" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">③</text>

  <path d="M 590 330 C 572 330, 558 334, 548 337" fill="none" stroke="#cf222e" stroke-width="1.4" marker-end="url(#arrow)"/>
  <circle cx="569" cy="324" r="9" fill="#cf222e"/>
  <text x="569" y="328" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">④</text>

  <!-- legend -->
  <text x="40" y="464" font-size="10.5" fill="#1f2328">① configMapKeyRef（单键 → env）　② configMap 卷挂载（键 → 文件）</text>
  <text x="430" y="464" font-size="10.5" fill="#1f2328">③ secretKeyRef（解码 → env）　④ secret 卷（0400）</text>

  <!-- heat-update chips -->
  <rect x="40" y="482" width="250" height="80" rx="8" fill="#f0fff4" stroke="#2da44e" stroke-width="1.3"/>
  <text x="56" y="506" font-size="10.5" font-weight="700" fill="#1a7f37">volume 挂载：会热更新</text>
  <text x="56" y="526" font-size="9.5" fill="#57606a">kubelet 约 1 分钟同步（原子替换</text>
  <text x="56" y="543" font-size="9.5" fill="#57606a">符号链接），应用需自己重新读取</text>

  <rect x="310" y="482" width="250" height="80" rx="8" fill="#fff1f0" stroke="#cf222e" stroke-width="1.3"/>
  <text x="326" y="506" font-size="10.5" font-weight="700" fill="#cf222e">env 注入：永不更新</text>
  <text x="326" y="526" font-size="9.5" fill="#57606a">环境变量在容器启动时就固定了，</text>
  <text x="326" y="543" font-size="9.5" fill="#57606a">改了 ConfigMap 也无济于事，须重启 Pod</text>

  <rect x="580" y="482" width="230" height="80" rx="8" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.3"/>
  <text x="596" y="506" font-size="10.5" font-weight="700" fill="#7d4e00">subPath 挂单文件：不同步</text>
  <text x="596" y="526" font-size="9.5" fill="#57606a">经典陷阱：kubelet 的同步只作用于</text>
  <text x="596" y="543" font-size="9.5" fill="#57606a">挂载点目录，不追踪 subPath 绑定挂载</text>

  <text x="40" y="594" font-size="10.5" font-weight="600" fill="#1f2328">记忆：volume 会同步、env 不会、subPath 也不会。</text>
</svg>
