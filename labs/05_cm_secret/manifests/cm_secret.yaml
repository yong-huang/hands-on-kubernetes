# =============================================================================
# Kubernetes 05: ConfigMap 与 Secret —— 配置与代码分离 (12-Factor 原则)
#
# 本文件演示：
#   1. ConfigMap：字面量 (literal) 方式 + 文件内容方式
#   2. Secret：Opaque 类型 + stringData (免手动 base64，由 k8s 自动编码)
#   3. Pod 消费 ConfigMap：环境变量 (valueFrom) + 卷挂载 (volumeMounts)
#   4. Pod 消费 Secret：环境变量 + 卷挂载 (模拟数据库密码)
# =============================================================================

# -----------------------------------------------------------------------------
# 1. ConfigMap：字面量方式 (from literal key-values)
#    适合少量、简单的键值对配置，例如日志级别、服务端口
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config            # ConfigMap 名字，Pod 中通过这个名字引用
  labels:
    app: demo-cm-secret
data:                         # data 中的键值都会以字符串形式存储
  LOG_LEVEL: "info"           # 日志级别
  MAX_CONNECTIONS: "100"      # 注意：ConfigMap 中所有值都是字符串
  APP_MODE: "production"      # 运行模式
---
# -----------------------------------------------------------------------------
# 2. ConfigMap：文件内容方式
#    手动把整个配置文件嵌入 ConfigMap，适合 nginx.conf / redis.conf 等场景
#    生产中更常用 kubectl create configmap --from-file 生成
# -----------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-file-config
  labels:
    app: demo-cm-secret
data:
  # 键名 = 挂载后的文件名，值 = 文件的完整内容
  app.conf: |
    # 模拟应用配置文件
    timeout = 30
    retries = 3
    debug = false
---
# -----------------------------------------------------------------------------
# 3. Secret：Opaque 类型 (最通用的自定义类型)
#    使用 stringData 而不是 data：
#      - data   需要自己先做 base64 编码 (echo -n 'xxx' | base64)
#      - stringData 直接写明文，API Server 会自动转成 base64 存入 etcd
#    注意：base64 只是编码，不是加密！任何人 decode 就能看到原文
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: db-secret            # 模拟数据库账号密码
  labels:
    app: demo-cm-secret
type: Opaque                 # Opaque = 任意自定义键值对
stringData:                  # 明文写入，k8s 自动 base64 编码
  DB_USERNAME: "admin"       # 数据库用户名
  DB_PASSWORD: "P@ssw0rd-123" # 数据库密码 (仅演示，生产切勿入库！)
---
# -----------------------------------------------------------------------------
# 4. Pod：同时消费 ConfigMap 和 Secret 的四种注入方式
#    ConfigMap: ① env (单个键)   ② volume (整个挂载)
#    Secret:    ③ env (单个键)   ④ volume (挂载为文件)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: app-pod
  labels:
    app: demo-cm-secret
spec:
  containers:
    - name: app
      image: busybox:1.36
      # 前台循环打印，方便 exec 进容器查看环境变量和挂载文件
      command: ["sh", "-c", "env | grep -E 'LOG_LEVEL|DB_' ; sleep 3600"]

      # -------- 方式 ①：ConfigMap 单键注入为环境变量 --------
      env:
        - name: LOG_LEVEL            # 容器内的环境变量名 (可以与键名不同)
          valueFrom:
            configMapKeyRef:
              name: app-config       # 引用哪个 ConfigMap
              key: LOG_LEVEL         # 引用其中的哪个键
        # -------- 方式 ③：Secret 单键注入为环境变量 --------
        - name: DB_PASSWORD          # 模拟数据库密码注入
          valueFrom:
            secretKeyRef:
              name: db-secret        # 引用哪个 Secret
              key: DB_PASSWORD       # base64 会被自动解码为明文

      volumeMounts:
        # -------- 方式 ②：ConfigMap 以卷形式挂载为文件 --------
        - name: config-volume        # 对应下方 volumes 中的名字
          mountPath: /etc/config     # 每个键会变成该目录下的一个文件
          readOnly: true
        # -------- 方式 ④：Secret 以卷形式挂载为文件 --------
        - name: secret-volume
          mountPath: /etc/secret     # 每个键一个文件，内容为解码后的明文
          readOnly: true

  volumes:
    - name: config-volume
      configMap:
        name: app-file-config       # 挂载上面第 2 个 ConfigMap
        # 可选：用 items 精确控制哪些键挂载、文件名是什么
        # items:
        #   - key: app.conf
        #     path: app.conf
    - name: secret-volume
      secret:
        secretName: db-secret       # 挂载上面第 3 个 Secret
        # 可选：设置文件权限 (八进制)，默认 0644；密码类建议收紧
        defaultMode: 0400
