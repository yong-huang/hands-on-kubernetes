<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#326ce5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2da44e"/>
    </marker>
  </defs>
<rect width="760" height="710" fill="#ffffff"/>
<text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">kind 架构：节点即 Docker 容器（Docker-in-Docker）</text>
<!-- ==================== 左侧：架构 ==================== -->

  <!-- kubectl -->
  <rect x="60" y="95" width="200" height="66" rx="10" fill="#eff5ff" stroke="#326ce5" stroke-width="1.5"/>
  <text x="160" y="122" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">kubectl</text>
  <text x="160" y="142" font-size="10.5" fill="#57606a" text-anchor="middle">context: kind-k8s-learn</text>
  <text x="285" y="120" font-size="10.5" fill="#57606a">‣ ~/.kube/config（kind 自动写入并切换）</text>
  <text x="285" y="137" font-size="10.5" fill="#57606a">‣ 与生产集群同一套 API</text>

  <!-- arrow kubectl -> docker boundary -->
  <line x1="160" y1="161" x2="160" y2="192" stroke="#326ce5" stroke-width="1.6" marker-end="url(#arrowBlue)"/>
  <text x="178" y="181" font-size="10" fill="#326ce5" stroke="#ffffff" stroke-width="3" paint-order="stroke">宿主机端口 → 节点 6443</text>

  <!-- Docker boundary -->
  <rect x="60" y="196" width="640" height="450" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="222" font-size="12.5" font-weight="600" fill="#57606a">宿主机 Docker daemon（OrbStack / Docker Desktop）</text>

  <!-- control-plane node -->
  <rect x="90" y="240" width="310" height="200" rx="10" fill="#ffffff" stroke="#326ce5" stroke-width="1.8"/>
  <rect x="90" y="240" width="310" height="34" rx="10" fill="#326ce5"/>
  <rect x="90" y="260" width="310" height="14" fill="#326ce5"/>
  <text x="106" y="262" font-size="13" font-weight="700" fill="#ffffff">k8s-learn-control-plane</text>
  <rect x="330" y="248" width="58" height="18" rx="9" fill="#ffffff" opacity="0.22"/>
  <text x="359" y="261" font-size="9.5" font-weight="600" fill="#ffffff" text-anchor="middle">容器</text>

  <g font-size="10.5" fill="#1f2328" text-anchor="middle">
    <rect x="102" y="286" width="140" height="30" rx="6" fill="#eff5ff" stroke="#a5c2ff"/>
    <text x="172" y="305">kube-apiserver :6443</text>
    <rect x="252" y="286" width="60" height="30" rx="6" fill="#eff5ff" stroke="#a5c2ff"/>
    <text x="282" y="305">etcd</text>
    <rect x="322" y="286" width="66" height="30" rx="6" fill="#eff5ff" stroke="#a5c2ff"/>
    <text x="355" y="305">scheduler</text>
    <rect x="102" y="324" width="140" height="30" rx="6" fill="#eff5ff" stroke="#a5c2ff"/>
    <text x="172" y="343">controller-manager</text>
    <rect x="252" y="324" width="136" height="30" rx="6" fill="#eff5ff" stroke="#a5c2ff"/>
    <text x="320" y="343">CNI: kindnet</text>
  </g>
  <!-- coredns pod -->
  <rect x="102" y="368" width="180" height="52" rx="8" fill="#f0fff4" stroke="#2da44e" stroke-width="1.3"/>
  <text x="192" y="389" font-size="11" font-weight="600" fill="#1a7f37" text-anchor="middle">Pod: coredns</text>
  <text x="192" y="406" font-size="9.5" fill="#57606a" text-anchor="middle">集群 DNS（.svc 域名解析）</text>
  <text x="300" y="390" font-size="9.5" fill="#57606a">kubeadm init 的</text>
  <text x="300" y="405" font-size="9.5" fill="#57606a">首个节点里完成</text>

  <!-- worker 1 -->
  <rect x="440" y="240" width="240" height="130" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/>
  <rect x="440" y="240" width="240" height="30" rx="10" fill="#1a7f37"/>
  <rect x="440" y="258" width="240" height="12" fill="#1a7f37"/>
  <text x="456" y="260" font-size="12.5" font-weight="700" fill="#ffffff">k8s-learn-worker</text>
  <g font-size="10" fill="#1f2328" text-anchor="middle">
    <rect x="452" y="280" width="66" height="26" rx="6" fill="#f0fff4" stroke="#8fd6a4"/>
    <text x="485" y="297">kubelet</text>
    <rect x="524" y="280" width="70" height="26" rx="6" fill="#f0fff4" stroke="#8fd6a4"/>
    <text x="559" y="297">containerd</text>
    <rect x="600" y="280" width="68" height="26" rx="6" fill="#f0fff4" stroke="#8fd6a4"/>
    <text x="634" y="297">kindnet</text>
  </g>
  <rect x="452" y="316" width="150" height="40" rx="8" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="527" y="333" font-size="10.5" font-weight="600" fill="#7d4e00" text-anchor="middle">Pod: nginx（测试负载）</text>
  <text x="527" y="348" font-size="9" fill="#7d4e00" text-anchor="middle">NodePort（端口随机）</text>

  <!-- worker 2 -->
  <rect x="440" y="392" width="240" height="130" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/>
  <rect x="440" y="392" width="240" height="30" rx="10" fill="#1a7f37"/>
  <rect x="440" y="410" width="240" height="12" fill="#1a7f37"/>
  <text x="456" y="412" font-size="12.5" font-weight="700" fill="#ffffff">k8s-learn-worker2</text>
  <g font-size="10" fill="#1f2328" text-anchor="middle">
    <rect x="452" y="432" width="66" height="26" rx="6" fill="#f0fff4" stroke="#8fd6a4"/>
    <text x="485" y="449">kubelet</text>
    <rect x="524" y="432" width="70" height="26" rx="6" fill="#f0fff4" stroke="#8fd6a4"/>
    <text x="559" y="449">containerd</text>
    <rect x="600" y="432" width="68" height="26" rx="6" fill="#f0fff4" stroke="#8fd6a4"/>
    <text x="634" y="449">kindnet</text>
  </g>
  <rect x="452" y="468" width="150" height="40" rx="8" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.2"/>
  <text x="527" y="485" font-size="10.5" font-weight="600" fill="#7d4e00" text-anchor="middle">Pod: nginx（测试负载）</text>
  <text x="527" y="500" font-size="9" fill="#7d4e00" text-anchor="middle">可调度到任一 worker</text>

  <!-- scheduling arrows cp -> workers -->
  <path d="M 400 300 C 420 300, 425 285, 438 283" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 400 330 C 415 330, 415 460, 438 458" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="419" y="272" font-size="9.5" fill="#57606a" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">调度</text>
  <!-- status report dashed arrow -->
  <path d="M 438 320 C 424 320, 424 350, 402 352" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="413" y="312" font-size="9.5" fill="#8b949e" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">上报</text>

  <!-- docker bottom note -->
  <rect x="90" y="470" width="310" height="72" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="245" y="494" font-size="10.5" fill="#1f2328" text-anchor="middle">‣ docker ps 可直接看到这 3 个"节点"</text>
  <text x="245" y="514" font-size="10.5" fill="#1f2328" text-anchor="middle">‣ kind delete cluster = 删 3 个容器，零残留</text>
  <text x="245" y="530" font-size="9.5" fill="#57606a" text-anchor="middle">实线 = 调度下发　·　虚线 = kubelet 上报状态</text>

  <text x="60" y="672" font-size="10.5" fill="#57606a">节点 = Docker 容器；容器里再跑 kubelet + 容器运行时（Docker-in-Docker），</text>
  <text x="60" y="691" font-size="10.5" fill="#57606a">kubeadm 组装成真实集群 —— 行为与生产一致，删了随手重建。</text>
</svg>
