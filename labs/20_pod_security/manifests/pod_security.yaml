# =============================================================================
# Pod Security Standards (PSS) 与 Pod Security Admission (PSA) 演示
# 三个 namespace 分别打不同的 enforce 标签, 验证同一批 Pod 在不同等级下的命运
# =============================================================================
---
# ============================================================
# 三个测试 namespace, 各自绑定不同的 PSA 等级标签
# 标签格式: pod-security.kubernetes.io/<mode>: <level>
#   mode   = enforce(拒绝) / audit(记录审计事件) / warn(提示警告)
#   level  = privileged / baseline / restricted
# 另有 pod-security.kubernetes.io/<mode>-version 标签可锁定策略版本,
# 如 enforce-version: v1.36 (缺省 latest, 建议生产显式固定)
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: psa-privileged
  labels:
    # privileged: 不做任何限制, 全部放开 (仅给真正需要特权的系统组件用)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: psa-baseline
  labels:
    # baseline: 禁止宿主机命名空间/特权容器/危险挂载等"明显越权"的行为
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: v1.36
---
apiVersion: v1
kind: Namespace
metadata:
  name: psa-restricted
  labels:
    # restricted: 最严格, 在 baseline 之上还要求非 root、削权、seccomp
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    # audit/warn 是"不拦截"的两种软模式:
    #   audit -> 违规 Pod 照常创建, 但在审计日志里记一条事件
    #   warn  -> 违规 Pod 照常创建, 但 kubectl 会打印警告信息
    # 典型灰度路径: 先 warn 观察影响面 -> 再 audit 留痕 -> 最后 enforce 强制
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
---
# ============================================================
# 测试 Pod 1: 特权容器 (privileged: true)
# 预期: psa-privileged 通过; psa-baseline / psa-restricted 被拒绝
# privileged 容器拥有宿主机内核的全部能力 (CAP_SYS_ADMIN 等),
# 等于把节点 root 交给了容器, 是最大的安全面
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-privileged
  namespace: psa-privileged        # 脚本会用 -n 覆盖, 分别投到三个 ns 测试
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true           # 特权模式: baseline 第一条就禁它
---
# ============================================================
# 测试 Pod 2: 使用宿主机网络 + hostPath (baseline 违规)
# hostNetwork: Pod 直接用节点网络栈 (能看到/干扰节点上所有连接)
# hostPath:    把节点目录挂进容器 (可读写宿主文件系统)
# 预期: psa-privileged 通过; psa-baseline / psa-restricted 被拒绝
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-hostpath
  namespace: psa-privileged
spec:
  hostNetwork: true                # 共享节点网络命名空间
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: host-root
          mountPath: /host          # 挂节点 / 目录, 危险挂载示例
  volumes:
    - name: host-root
      hostPath:
        path: /
---
# ============================================================
# 测试 Pod 3: restricted 合规 Pod (安全配置"全家桶")
# 四件套: runAsNonRoot + drop ALL + allowPrivilegeEscalation: false + seccomp
# 预期: 三个 namespace 全部通过 (合规在哪都合规)
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-compliant
  namespace: psa-restricted
spec:
  securityContext:
    runAsNonRoot: true             # 禁止以 uid=0 运行
    runAsUser: 1000                # 显式指定非 root uid
    seccompProfile:                # 限制容器可用的系统调用集
      type: RuntimeDefault
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false   # 禁止 sudo/suid 提权
        capabilities:
          drop: ["ALL"]                  # 丢掉全部 Linux capabilities
        seccompProfile:
          type: RuntimeDefault
---
# ============================================================
# 测试 Pod 4: 不合规 restricted Pod (以 root 运行)
# busybox 默认 uid=0, 未设 runAsNonRoot -> 违反 restricted
# 预期: psa-privileged / psa-baseline 通过 (baseline 不管 root);
#       psa-restricted 被拒绝
# ============================================================
apiVersion: v1
kind: Pod
metadata:
  name: pod-root
  namespace: psa-restricted
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "3600"]   # 默认以 root 运行 -> restricted 拒绝
