# metadata:
#   name: root                        # 根应用: 管理其他 Application 的 Application
#   namespace: argocd
# spec:
#   project: default
#   source:
#     repoURL: https://github.com/<you>/<your-manifests>.git
#     targetRevision: main
#     path: apps                      # 该目录下每个 *.yaml 都是一个子 Application
#   destination:
#     server: https://kubernetes.default.svc
#     namespace: argocd               # 子 Application 也必须落在 argocd 命名空间
#   syncPolicy:
#     automated:
#       prune: true                   # 删掉 apps/xxx.yaml = 自动删除对应子应用
#       selfHeal: true
