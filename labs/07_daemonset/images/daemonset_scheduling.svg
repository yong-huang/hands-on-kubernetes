<svg xmlns="http://www.w3.org/2000/svg" width="820" height="640" viewBox="0 0 820 640" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2da44e"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect width="820" height="640" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">DaemonSet：副本数由节点数决定</text>

  <!-- controller -->
  <rect x="40" y="96" width="300" height="82" rx="10" fill="#f0fff4" stroke="#1a7f37" stroke-width="1.6"/>
  <text x="56" y="120" font-size="12.5" font-weight="700" fill="#1a7f37">DaemonSet controller</text>
  <text x="56" y="142" font-size="9.5" fill="#57606a">监听节点 + DaemonSet 变化</text>
  <text x="56" y="160" font-size="9.5" fill="#57606a">为每个"合格节点"确保恰好 1 个 Pod</text>

  <!-- nodes -->
  <g>
    <rect x="40" y="222" width="234" height="118" rx="10" fill="#ffffff" stroke="#326ce5" stroke-width="1.8"/>
    <rect x="40" y="222" width="234" height="26" rx="10" fill="#326ce5"/>
    <rect x="40" y="236" width="234" height="12" fill="#326ce5"/>
    <text x="52" y="240" font-size="11" font-weight="700" fill="#ffffff">control-plane</text>
    <rect x="52" y="256" width="210" height="24" rx="5" fill="#fff8e6" stroke="#d4a72c"/>
    <text x="157" y="272" font-size="8.5" fill="#7d4e00" text-anchor="middle">taint: control-plane:NoSchedule</text>
    <rect x="52" y="288" width="210" height="40" rx="6" fill="#f0fff4" stroke="#2da44e" stroke-width="1.3"/>
    <text x="157" y="305" font-size="9.5" fill="#1a7f37" text-anchor="middle">Agent Pod ✓</text>
    <text x="157" y="320" font-size="8" fill="#57606a" text-anchor="middle">靠 tolerations 才能上来</text>
  </g>
  <g>
    <rect x="294" y="222" width="234" height="118" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/>
    <rect x="294" y="222" width="234" height="26" rx="10" fill="#1a7f37"/>
    <rect x="294" y="236" width="234" height="12" fill="#1a7f37"/>
    <text x="306" y="240" font-size="11" font-weight="700" fill="#ffffff">worker-1</text>
    <rect x="306" y="288" width="210" height="40" rx="6" fill="#f0fff4" stroke="#2da44e" stroke-width="1.3"/>
    <text x="411" y="305" font-size="9.5" fill="#1a7f37" text-anchor="middle">Agent Pod ✓</text>
    <text x="411" y="320" font-size="8" fill="#57606a" text-anchor="middle">恰好一个，不堆叠</text>
  </g>
  <g>
    <rect x="548" y="222" width="234" height="118" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1.8"/>
    <rect x="548" y="222" width="234" height="26" rx="10" fill="#1a7f37"/>
    <rect x="548" y="236" width="234" height="12" fill="#1a7f37"/>
    <text x="560" y="240" font-size="11" font-weight="700" fill="#ffffff">worker-2</text>
    <rect x="560" y="288" width="210" height="40" rx="6" fill="#f0fff4" stroke="#2da44e" stroke-width="1.3"/>
    <text x="665" y="305" font-size="9.5" fill="#1a7f37" text-anchor="middle">Agent Pod ✓</text>
    <text x="665" y="320" font-size="8" fill="#57606a" text-anchor="middle">新节点加入自动补上</text>
  </g>

  <path d="M 120 178 C 120 200, 145 205, 152 218" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 190 178 C 200 200, 400 205, 408 218" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 260 178 C 300 205, 620 205, 662 218" fill="none" stroke="#8b949e" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="410" y="368" font-size="10.5" font-weight="600" fill="#1f2328" text-anchor="middle">kubectl get daemonset → DESIRED = 3 = 合格节点数（不是声明出来的数字）</text>

  <!-- gates -->
  <text x="40" y="404" font-size="11.5" font-weight="700" fill="#1f2328">一个节点要"合格"，需过三道闸：</text>
  <g font-size="9.5">
    <rect x="40" y="416" width="234" height="58" rx="8" fill="#eff5ff" stroke="#326ce5" stroke-width="1.3"/>
    <text x="54" y="438" font-size="10.5" font-weight="700" fill="#1f2328">① selector / affinity 匹配</text>
    <text x="54" y="458" fill="#57606a">nodeSelector · nodeAffinity</text>
    <rect x="294" y="416" width="234" height="58" rx="8" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.3"/>
    <text x="308" y="438" font-size="10.5" font-weight="700" fill="#1f2328">② 污点被容忍</text>
    <text x="308" y="458" fill="#57606a">tolerations：精确 key 或 operator: Exists</text>
    <rect x="548" y="416" width="234" height="58" rx="8" fill="#fff1f0" stroke="#cf222e" stroke-width="1.3"/>
    <text x="562" y="438" font-size="10.5" font-weight="700" fill="#1f2328">③ 节点可调度</text>
    <text x="562" y="458" fill="#57606a">cordon / drain 中的节点不补 Pod</text>
  </g>

  <!-- label demo -->
  <text x="40" y="510" font-size="11.5" font-weight="700" fill="#1f2328">标签即时生效（ssd-cache-agent · nodeAffinity disktype=ssd）</text>
  <rect x="40" y="524" width="360" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.2"/>
  <text x="56" y="548" font-size="10" fill="#1f2328">kubectl label node worker-2 disktype=ssd</text>
  <path d="M 404 544 L 446 544" fill="none" stroke="#2da44e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
  <rect x="450" y="524" width="130" height="40" rx="8" fill="#f0fff4" stroke="#2da44e" stroke-width="1.3"/>
  <text x="515" y="548" font-size="10" fill="#1a7f37" text-anchor="middle">Pod 立即创建 ✓</text>

  <rect x="600" y="524" width="120" height="40" rx="8" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.2"/>
  <text x="660" y="548" font-size="10" fill="#1f2328" text-anchor="middle">去掉标签</text>
  <path d="M 600 544 L 588 544" fill="none" stroke="#cf222e" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <rect x="450" y="574" width="270" height="36" rx="8" fill="#fff1f0" stroke="#cf222e" stroke-width="1.3"/>
  <text x="585" y="596" font-size="10" fill="#cf222e" text-anchor="middle">该节点的 Pod 被自动删除</text>
  <text x="40" y="596" font-size="9.5" fill="#57606a">节点扩容同理：新节点加入 → 自动获得 Agent</text>
</svg>
