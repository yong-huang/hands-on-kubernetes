# =============================================================================
# EFK 日志聚合: Fluent Bit DaemonSet -> Elasticsearch -> Kibana
# 数据流: 容器 stdout/stderr -> /var/log/containers/*.log (节点上)
#         -> Fluent Bit 采集+解析+加元数据 -> ES 索引 -> Kibana 检索
# =============================================================================
---
# 1. 日志产生者: 每秒输出一行 JSON 日志的应用
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-generator
  namespace: logging-demo
spec:
  replicas: 1
  selector: {matchLabels: {app: log-generator}}
  template:
    metadata:
      labels: {app: log-generator}
    spec:
      containers:
        - name: gen
          image: busybox:1.36
          command: ["sh", "-c",
            "i=0; while true; do i=$((i+1));
             printf '{\"seq\":%d,\"level\":\"%s\",\"msg\":\"hello from pod\",\"ts\":\"%s\"}\n' \
               $i $([ $((i%5)) -eq 0 ] && echo ERROR || echo INFO) \"$(date -Iseconds)\";
             sleep 1; done"]
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: logging
spec:
  selector: {app: elasticsearch}
  ports: [{name: http, port: 9200, targetPort: 9200}]
---
# 2. Elasticsearch: 单节点(实验), 生产至少 3 master + SSD
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: logging
spec:
  serviceName: elasticsearch
  replicas: 1
  selector: {matchLabels: {app: elasticsearch}}
  template:
    metadata:
      labels: {app: elasticsearch}
    spec:
      containers:
        - name: es
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}   # 实验关闭认证
            - {name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports: [{containerPort: 9200}]
          resources:
            requests: {memory: 1Gi}
          readinessProbe:
            httpGet: {path: /_cluster/health, port: 9200}
            initialDelaySeconds: 20
---
# 3. Fluent Bit DaemonSet: 每节点一个, 尾读容器日志并转发 ES
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
spec:
  selector: {matchLabels: {app: fluent-bit}}
  template:
    metadata:
      labels: {app: fluent-bit}
    spec:
      serviceAccountName: fluent-bit
      tolerations:                       # 能调度到 master/control-plane 节点
        - operator: Exists
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:2.2
          volumeMounts:
            - {name: varlog, mountPath: /var/log}          # 宿主机容器日志
            - {name: config, mountPath: /fluent-bit/etc/}
      volumes:
        - name: varlog
          hostPath: {path: /var/log}
        - name: config
          configMap: {name: fluent-bit-config}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: fluent-bit, namespace: logging}
---
# RBAC: 读 Pod/Namespace 元数据(k8s filter 给日志打 ns/pod 标签用)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: fluent-bit-read}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: fluent-bit-read}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: fluent-bit-read}
subjects:
  - {kind: ServiceAccount, name: fluent-bit, namespace: logging}
---
# 4. Fluent Bit 配置: tail 输入 -> kubernetes 元数据增强 -> es 输出
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Tag               kube.*
        Refresh_Interval  10
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
    [FILTER]
        Name                  kubernetes
        Match                 kube.*
        Kube_URL              https://kubernetes.default.svc:443
        # Merge_Log: 解析 JSON 日志体 (fluent-bit 配置不支持行内注释, 注释须独立成行)
        Merge_Log             On
        Keep_Log              Off
    [OUTPUT]
        Name   es
        Match  *
        Host   elasticsearch.logging.svc.cluster.local
        Port   9200
        # Logstash_Format 按天分索引, 前缀取 Logstash_Prefix (不是 Index)
        Logstash_Prefix k8s-logs
        Logstash_Format On
        # ES 8.x 已移除 _type, 必须抑制否则 _bulk 全部被 400 拒绝
        Suppress_Type_Name On
        Retry_Limit False
---
# 5. Kibana 可视化检索
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
spec:
  replicas: 1
  selector: {matchLabels: {app: kibana}}
  template:
    metadata:
      labels: {app: kibana}
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.11.3
          env:
            - {name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch.logging.svc:9200"}
          ports: [{containerPort: 5601}]
