<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <rect width="800" height="560" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">CronJob：定时创建 Job 的调度器</text>

  <!-- cronjob box -->
  <rect x="40" y="96" width="350" height="92" rx="10" fill="#eff5ff" stroke="#326ce5" stroke-width="1.6"/>
  <text x="56" y="120" font-size="12.5" font-weight="700" fill="#326ce5">CronJob · db-backup</text>
  <text x="56" y="142" font-size="9.5" fill="#1f2328">schedule: "0 * * * *"（分 时 日 月 周 → 每小时整点）</text>
  <text x="56" y="160" font-size="9.5" fill="#57606a">每次 tick 按 jobTemplate 创建一个 Job</text>
  <text x="56" y="178" font-size="9" fill="#8b949e">真正干活的是 Job —— CronJob 只是它的定时调度器</text>

  <!-- time semantics -->
  <rect x="430" y="96" width="330" height="92" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.4"/>
  <text x="446" y="120" font-size="12.5" font-weight="700" fill="#1f2328">时间语义</text>
  <text x="446" y="142" font-size="9.5" fill="#57606a">tick 精度：分钟级</text>
  <text x="446" y="160" font-size="9.5" fill="#57606a">时区：控制器所在时区（通常 UTC）</text>
  <text x="446" y="178" font-size="9.5" fill="#57606a">suspend: true → 暂停后续所有调度（保留配置）</text>

  <!-- timeline axis -->
  <line x1="60" y1="228" x2="740" y2="228" stroke="#d0d7de" stroke-width="2"/>
  <line x1="150" y1="222" x2="150" y2="234" stroke="#8b949e" stroke-width="2"/>
  <line x1="480" y1="222" x2="480" y2="234" stroke="#cf222e" stroke-width="2"/>
  <text x="150" y="250" font-size="9.5" fill="#57606a" text-anchor="middle">t0 · 上一轮触发</text>
  <text x="480" y="250" font-size="9.5" fill="#cf222e" text-anchor="middle">t1 · 新调度点（上一轮还在跑）</text>

  <!-- Allow -->
  <rect x="40" y="270" width="110" height="44" rx="8" fill="#eff5ff" stroke="#326ce5" stroke-width="1.4"/>
  <text x="95" y="289" font-size="10.5" font-weight="700" fill="#326ce5" text-anchor="middle">Allow</text>
  <text x="95" y="305" font-size="8.5" fill="#57606a" text-anchor="middle">（默认）</text>
  <rect x="170" y="276" width="270" height="26" rx="6" fill="#f0fff4" stroke="#2da44e" stroke-width="1.3"/>
  <text x="305" y="293" font-size="9.5" fill="#1a7f37" text-anchor="middle">Job A（上一轮，还在跑）</text>
  <rect x="480" y="276" width="240" height="26" rx="6" fill="#eff5ff" stroke="#326ce5" stroke-width="1.3"/>
  <text x="600" y="293" font-size="9.5" fill="#326ce5" text-anchor="middle">Job B（新触发，照样创建）</text>
  <text x="740" y="293" font-size="9" fill="#57606a">并发执行</text>

  <!-- Forbid -->
  <rect x="40" y="334" width="110" height="44" rx="8" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.4"/>
  <text x="95" y="353" font-size="10.5" font-weight="700" fill="#7d4e00" text-anchor="middle">Forbid</text>
  <text x="95" y="369" font-size="8.5" fill="#57606a" text-anchor="middle">跳过本次</text>
  <rect x="170" y="340" width="370" height="26" rx="6" fill="#f0fff4" stroke="#2da44e" stroke-width="1.3"/>
  <text x="355" y="357" font-size="9.5" fill="#1a7f37" text-anchor="middle">Job A（还在跑）</text>
  <rect x="480" y="340" width="180" height="26" rx="6" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="570" y="357" font-size="9.5" fill="#8b949e" text-anchor="middle">Job B：被跳过</text>
  <text x="680" y="357" font-size="9" fill="#57606a">绝不允许重叠</text>

  <!-- Replace -->
  <rect x="40" y="398" width="110" height="44" rx="8" fill="#fff1f0" stroke="#cf222e" stroke-width="1.4"/>
  <text x="95" y="417" font-size="10.5" font-weight="700" fill="#cf222e" text-anchor="middle">Replace</text>
  <text x="95" y="433" font-size="8.5" fill="#57606a" text-anchor="middle">顶替旧的</text>
  <rect x="170" y="404" width="230" height="26" rx="6" fill="#f0fff4" stroke="#2da44e" stroke-width="1.3"/>
  <text x="285" y="421" font-size="9.5" fill="#1a7f37" text-anchor="middle">Job A（跑到一半…）</text>
  <path d="M 400 404 L 400 430" stroke="#cf222e" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="412" y="400" font-size="8.5" fill="#cf222e">被杀</text>
  <rect x="480" y="404" width="200" height="26" rx="6" fill="#eff5ff" stroke="#326ce5" stroke-width="1.3"/>
  <text x="580" y="421" font-size="9.5" fill="#326ce5" text-anchor="middle">Job B 顶上</text>
  <text x="700" y="421" font-size="9" fill="#57606a">只认最新一次</text>

  <!-- notes -->
  <rect x="40" y="470" width="720" height="66" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="56" y="494" font-size="10.5" fill="#1f2328">‣ startingDeadlineSeconds：错过的 tick 在期限内补跑，超期直接跳过（控制器宕机恢复后可能连错多个）</text>
  <text x="56" y="516" font-size="10.5" fill="#1f2328">‣ successfulJobsHistoryLimit / failedJobsHistoryLimit：保留多少个历史 Job 供查日志，超出自动删除</text>
</svg>
