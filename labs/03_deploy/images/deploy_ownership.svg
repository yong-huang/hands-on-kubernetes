<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#326ce5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2da44e"/>
    </marker>
  </defs>
<rect width="720" height="620" fill="#ffffff"/>
<text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">Deployment → ReplicaSet → Pod 三层 ownership</text>
<!-- ==================== 左侧：三层 ownership ==================== -->

  <!-- Deployment -->
  <rect x="140" y="100" width="360" height="78" rx="10" fill="#ffffff" stroke="#326ce5" stroke-width="1.8"/>
  <rect x="140" y="100" width="360" height="28" rx="10" fill="#326ce5"/>
  <rect x="140" y="114" width="360" height="14" fill="#326ce5"/>
  <text x="156" y="119" font-size="12.5" font-weight="700" fill="#ffffff">Deployment · nginx-rolling</text>
  <text x="156" y="146" font-size="9.5" fill="#57606a">replicas: 3 · revisionHistoryLimit: 5 · RollingUpdate</text>
  <text x="156" y="164" font-size="10.5" fill="#1f2328">改 spec.template（镜像/Env/卷…）= 触发滚动更新</text>

  <!-- owns arrows -->
  <path d="M 250 178 C 235 198, 220 205, 207 220" fill="none" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="215" y="194" font-size="8.5" fill="#8b949e" stroke="#ffffff" stroke-width="3" paint-order="stroke">owns</text>
  <path d="M 390 178 C 405 198, 420 205, 433 220" fill="none" stroke="#8b949e" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="412" y="194" font-size="8.5" fill="#8b949e" stroke="#ffffff" stroke-width="3" paint-order="stroke">owns</text>

  <!-- old ReplicaSet -->
  <rect x="80" y="222" width="250" height="84" rx="10" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.5"/>
  <rect x="80" y="222" width="250" height="24" rx="10" fill="#57606a"/>
  <rect x="80" y="234" width="250" height="12" fill="#57606a"/>
  <text x="94" y="239" font-size="10.5" font-weight="700" fill="#ffffff">ReplicaSet · 旧（revision 1）</text>
  <text x="94" y="268" font-size="9.5" fill="#57606a">pod-template-hash: 7f9c4b（v1 镜像）</text>
  <text x="94" y="288" font-size="9.5" fill="#57606a">desired=0 —— 缩容但保留，回滚的原材料</text>

  <!-- new ReplicaSet -->
  <rect x="370" y="222" width="250" height="84" rx="10" fill="#ffffff" stroke="#2da44e" stroke-width="1.8"/>
  <rect x="370" y="222" width="250" height="24" rx="10" fill="#1a7f37"/>
  <rect x="370" y="234" width="250" height="12" fill="#1a7f37"/>
  <text x="384" y="239" font-size="10.5" font-weight="700" fill="#ffffff">ReplicaSet · 新（revision 2）</text>
  <text x="384" y="268" font-size="9.5" fill="#57606a">pod-template-hash: 8a1d3e（v2 镜像）</text>
  <text x="384" y="288" font-size="9.5" fill="#1a7f37">desired=3 —— 扩容中 → 3/3 Ready</text>

  <!-- surge / shrink between RS -->
  <path d="M 334 252 L 366 252" fill="none" stroke="#2da44e" stroke-width="1.6" marker-end="url(#arrowGreen)"/>
  <text x="350" y="244" font-size="9.5" font-weight="700" fill="#1a7f37" text-anchor="middle">＋1</text>
  <path d="M 366 288 L 334 288" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="350" y="305" font-size="9.5" font-weight="700" fill="#57606a" text-anchor="middle">－1</text>
  <text x="350" y="326" font-size="8.5" fill="#57606a" text-anchor="middle">同步进行</text>

  <!-- pods under old RS (dashed = scaled to 0) -->
  <path d="M 205 306 L 122 338" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 2"/>
  <path d="M 205 306 L 186 338" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 2"/>
  <path d="M 205 306 L 246 338" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="90" y="340" width="56" height="30" rx="6" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="118" y="359" font-size="10" fill="#8b949e" text-anchor="middle">v1</text>
  <rect x="154" y="340" width="56" height="30" rx="6" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="182" y="359" font-size="10" fill="#8b949e" text-anchor="middle">v1</text>
  <rect x="218" y="340" width="56" height="30" rx="6" fill="none" stroke="#8b949e" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="246" y="359" font-size="10" fill="#8b949e" text-anchor="middle">v1</text>
  <text x="182" y="388" font-size="8.5" fill="#8b949e" text-anchor="middle">虚线 = 已被替换（缩到 0）</text>

  <!-- pods under new RS -->
  <path d="M 495 306 L 412 338" fill="none" stroke="#2da44e" stroke-width="1"/>
  <path d="M 495 306 L 476 338" fill="none" stroke="#2da44e" stroke-width="1"/>
  <path d="M 495 306 L 536 338" fill="none" stroke="#2da44e" stroke-width="1"/>
  <rect x="380" y="340" width="56" height="30" rx="6" fill="#f0fff4" stroke="#2da44e" stroke-width="1.4"/>
  <text x="408" y="359" font-size="10" font-weight="700" fill="#1a7f37" text-anchor="middle">v2</text>
  <rect x="444" y="340" width="56" height="30" rx="6" fill="#f0fff4" stroke="#2da44e" stroke-width="1.4"/>
  <text x="472" y="359" font-size="10" font-weight="700" fill="#1a7f37" text-anchor="middle">v2</text>
  <rect x="508" y="340" width="56" height="30" rx="6" fill="#f0fff4" stroke="#2da44e" stroke-width="1.4"/>
  <text x="536" y="359" font-size="10" font-weight="700" fill="#1a7f37" text-anchor="middle">v2</text>
  <text x="472" y="388" font-size="8.5" fill="#57606a" text-anchor="middle">当前服务的副本</text>

  <text x="60" y="418" font-size="9.5" fill="#57606a">被缩到 0 的旧 RS 就是 rollout history（revisionHistoryLimit=5）—— rollout undo 的原材料</text>

  <!-- left note box -->
  <rect x="60" y="470" width="560" height="85" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="76" y="492" font-size="10.5" fill="#1f2328">‣ Deployment 不直接管 Pod：改 template → 新建 RS → 按策略同步扩新缩旧</text>
  <text x="76" y="511" font-size="10.5" fill="#1f2328">‣ Pod 靠 pod-template-hash 标签认主；selector 创建后不可修改</text>
  <text x="76" y="530" font-size="10.5" fill="#1f2328">‣ 三大能力：自愈（副本维持）/ 扩缩容（改 replicas）/ 滚动更新 + 回滚</text>
<text x="40" y="592" font-size="10.5" fill="#57606a">改 spec.template = 触发滚动更新；rollout undo = 把旧 RS 模板拷回，再正向滚一次。</text>
</svg>
