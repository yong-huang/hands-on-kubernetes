# =============================================================================
# 镜像安全与漏洞扫描演示清单
# 组成: 1) demo 应用 (故意用老镜像, 供 Trivy 扫出漏洞)          [tier=app]
#       2) VulnerabilityReport 示例 (Trivy Operator 扫描产物 CRD, 节选结构)
#       3) Kyverno 准入策略: 阻止高危漏洞 / 未签名镜像进入集群   [tier=policy]
#
# 分层标签 (与 lab 12/17 相同的套路): 脚本按步骤 `kubectl apply -l tier=...`
# 分批生效 —— 先部署应用观察 Trivy 报告, 再以 Audit 模式上策略观察,
# 最后脚本把策略切到 Enforce 演示真实拦截 (deploy 阶段不装策略,
# 否则 vulnerable-app 自己就会被挡住, 演示自相矛盾)。
# =============================================================================
---
# 1. 演示命名空间 + 故意带漏洞的旧版应用
apiVersion: v1
kind: Namespace
metadata:
  name: imgsec-demo
  labels:
    pod-security.kubernetes.io/enforce: baseline
    tier: app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vulnerable-app
  namespace: imgsec-demo
  labels:
    app: vulnerable-app
    tier: app
spec:
  replicas: 1
  selector: {matchLabels: {app: vulnerable-app}}
  template:
    metadata:
      labels: {app: vulnerable-app}
    spec:
      containers:
        - name: app
          image: nginx:1.14.2            # 老版本, 已知含多个 CVE
          ports: [{containerPort: 80}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
---
# 2. Trivy Operator 扫描产物示例: VulnerabilityReport (节选字段)
#    真实报告由 trivy-operator 自动生成, 这里仅作结构示意。
#    注意: 标签用 tier=example 而非 tier=app —— 否则会被
#    `kubectl apply -l tier=app` 选中, 而新版 CRD 要求字段齐全导致 apply 失败。
apiVersion: aquasecurity.github.io/v1alpha1
kind: VulnerabilityReport
metadata:
  name: deployment-vulnerable-app-nginx
  namespace: imgsec-demo
  labels:
    resource-spec-vendor: trivy-operator
    tier: example
report:
  artifact: {repository: library/nginx, tag: "1.14.2"}
  summary:
    criticalCount: 3
    highCount: 11
    mediumCount: 27
    lowCount: 8
    unknownCount: 0
  vulnerabilities:
    - vulnerabilityID: CVE-2019-9511
      severity: HIGH
      title: HTTP/2 Rapid Reset
      fixedVersion: "1.25.3"
    - vulnerabilityID: CVE-2021-23017
      severity: HIGH
      title: DNS resolver off-by-one
      fixedVersion: "1.21.0"
---
# 3a. Kyverno 策略: 拒绝已知高危漏洞大版本的镜像
#     以 Audit 模式安装 (脚本观察后再 patch 成 Enforce 演示真实拦截)。
#     说明: "!*nginx:1.14.*" 这类"取反通配"在 Kyverno pattern 里是非法语法;
#     正确写法是 deny 规则 + JMESPath 条件 (regex_match 是支持的内置函数)。
#     本策略是"按 tag 拦截"的演示 (tag 即漏洞版本的指纹); 生产中应改为
#     依据 trivy-operator 生成的 VulnerabilityReport 数据做门禁 (如配合
#     policy-reporter 或在 CI 阶段查询报告后再放行部署)。
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: block-critical-vuln-images
  labels:
    tier: policy
spec:
  validationFailureAction: Audit         # 先 Audit 观察, deny 步骤会切 Enforce
  background: false                      # deny 条件引用请求对象, 仅准入时校验
  rules:
    - name: deny-critical-vulnerabilities
      match:
        any:
          - resources: {kinds: [Pod]}
      # 系统命名空间豁免: 系统组件常拉取"未收编"的基础镜像, 不能被误伤
      exclude:
        any:
          - resources:
              namespaces: ["kube-system", "kyverno", "trivy-system"]
      validate:
        message: "镜像 nginx:1.14.x 属于已知高危漏洞版本, 禁止部署"
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^nginx:1\\.14\\..*', element.image) }}"
                    operator: Equals
                    value: true
---
# 3b. Kyverno 策略: 强制镜像签名校验 (cosign verify)
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  labels:
    tier: policy
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: check-signature
      match:
        any:
          - resources: {kinds: [Pod]}
      exclude:
        any:
          - resources:
              namespaces: ["kube-system", "trivy-system", "kyverno"]
      verifyImages:
        - imageReferences: ["registry.example.com/*"]
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE...
                      -----END PUBLIC KEY-----
