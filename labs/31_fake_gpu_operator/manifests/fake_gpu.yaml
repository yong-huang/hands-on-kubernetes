# =============================================================================
# Fake GPU Operator: 在无 GPU 的机器上模拟 nvidia.com/gpu 资源
# 原理: 真实链路是 Device Plugin DaemonSet 通过 gRPC socket 向 kubelet 上报设备;
#       模拟版用 status-updater 直接改 Node 的 capacity/allocatable 字段,
#       调度器视角完全一致 —— 扩展资源只认数字, 不关心来源
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-demo
---
# 1. RBAC: 允许 updater 改节点状态(真实 operator 也是这么上报的)
apiVersion: v1
kind: ServiceAccount
metadata: {name: fake-gpu-updater, namespace: gpu-demo}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: fake-gpu-updater}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/status]   # patch --subresource=status 需要 nodes/status
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: fake-gpu-updater}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole,
          name: fake-gpu-updater}
subjects:
  - {kind: ServiceAccount, name: fake-gpu-updater, namespace: gpu-demo}
---
# 2. Device Plugin 模拟器(DaemonSet): 给每个节点"插上" 8 张假 GPU
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fake-gpu-plugin
  namespace: gpu-demo
spec:
  selector: {matchLabels: {app: fake-gpu-plugin}}
  template:
    metadata:
      labels: {app: fake-gpu-plugin}
    spec:
      serviceAccountName: fake-gpu-updater
      tolerations: [{operator: Exists}]
      containers:
        - name: updater
          # kubectl 类镜像多无 shell, 改用 python + 直调 K8s API (RBAC 已授予
          # nodes/status 的 patch), pip 走国内源装 requests, 每 15s 补写一次容量
          image: python:3.12-slim
          env:
            - name: FAKE_GPUS_PER_NODE
              value: "8"
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          command: ["sh", "-c"]
          args:
            - |
              pip install -q -i https://pypi.tuna.tsinghua.edu.cn/simple requests \
                && exec python -c "
              import os, time, json, urllib.request, ssl
              node = os.environ['NODE_NAME']
              n = os.environ['FAKE_GPUS_PER_NODE']
              ctx = ssl.create_default_context(
                  cafile='/var/run/secrets/kubernetes.io/serviceaccount/ca.crt')
              token = open('/var/run/secrets/kubernetes.io/serviceaccount/token').read()
              payload = json.dumps([{'op': 'add', 'path': '/status/capacity/nvidia.com~1gpu', 'value': n},
                                    {'op': 'add', 'path': '/status/allocatable/nvidia.com~1gpu', 'value': n}]).encode()
              url = 'https://kubernetes.default.svc/api/v1/nodes/' + node + '/status'
              while True:
                  try:
                      req = urllib.request.Request(url, data=payload, method='PATCH')
                      req.add_header('Authorization', 'Bearer ' + token)
                      req.add_header('Content-Type', 'application/json-patch+json')
                      urllib.request.urlopen(req, context=ctx)
                  except Exception as e:
                      print('patch failed:', e, flush=True)
                  time.sleep(15)   # 定时补写, 防止被真实设备状态覆盖
              "
---
# 3. 团队命名空间配额: 最多申请 4 张卡 (超出配额的 Pod 在 admission 阶段被直接拒绝, 根本不会创建)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-gpu-quota
  namespace: gpu-demo
spec:
  hard:
    requests.nvidia.com/gpu: "4"     # 团队 GPU 总额度
    limits.nvidia.com/gpu: "4"
---
# 4. AI 训练任务: 申请 GPU 资源 (扩展资源的 requests==limits 强制相等)
apiVersion: batch/v1
kind: Job
metadata:
  name: train-job-small
  namespace: gpu-demo
spec:
  template:
    metadata:
      labels: {job: train-small}
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: busybox:1.36
          command: ["sh", "-c", "echo 'training on 1 fake GPU'; sleep 30"]
          resources:
            requests: {nvidia.com/gpu: 1}   # 调度器按此过滤节点
            limits:   {nvidia.com/gpu: 1}
---
# 5. 大任务: 要 6 张卡 -> 单节点只有 8 张但配额只剩 3 -> 卡在配额/Pending
apiVersion: batch/v1
kind: Job
metadata:
  name: train-job-big
  namespace: gpu-demo
spec:
  template:
    metadata:
      labels: {job: train-big}
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: busybox:1.36
          command: ["sh", "-c", "echo 'training on 6 fake GPUs'; sleep 30"]
          resources:
            requests: {nvidia.com/gpu: 6}
            limits:   {nvidia.com/gpu: 6}
