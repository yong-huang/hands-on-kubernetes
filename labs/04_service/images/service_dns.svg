<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="-apple-system,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect width="820" height="500" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="700" fill="#1f2328">ClusterDNS：Service 名如何变成 IP</text>

  <!-- lane A: normal service -->
  <rect x="40" y="104" width="180" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.3"/>
  <text x="56" y="127" font-size="11" font-weight="700" fill="#1f2328">集群内任意 Pod</text>
  <text x="56" y="147" font-size="9.5" fill="#57606a">curl nginx-clusterip</text>

  <line x1="220" y1="132" x2="256" y2="132" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="104" width="170" height="56" rx="8" fill="#eff5ff" stroke="#326ce5" stroke-width="1.4"/>
  <text x="345" y="127" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">CoreDNS</text>
  <text x="345" y="147" font-size="9.5" fill="#57606a" text-anchor="middle">创建 Service 即自动注册</text>

  <line x1="430" y1="132" x2="466" y2="132" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="448" y="124" font-size="9" fill="#57606a" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">A 记录</text>

  <rect x="470" y="104" width="310" height="56" rx="8" fill="#f0fff4" stroke="#2da44e" stroke-width="1.4"/>
  <text x="486" y="127" font-size="11" font-weight="700" fill="#1a7f37">返回 VIP：10.96.0.10（一条 A 记录）</text>
  <text x="486" y="147" font-size="9" fill="#57606a">之后由节点上的 kube-proxy 规则 DNAT 到具体 Pod</text>

  <!-- lane B: headless -->
  <rect x="40" y="236" width="180" height="56" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.3"/>
  <text x="56" y="259" font-size="11" font-weight="700" fill="#1f2328">集群内任意 Pod</text>
  <text x="56" y="279" font-size="9.5" fill="#57606a">nslookup nginx-headless</text>

  <line x1="220" y1="264" x2="256" y2="264" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="260" y="236" width="170" height="56" rx="8" fill="#eff5ff" stroke="#326ce5" stroke-width="1.4"/>
  <text x="345" y="259" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">CoreDNS</text>
  <text x="345" y="279" font-size="9.5" fill="#57606a" text-anchor="middle">clusterIP: None → 特殊处理</text>

  <line x1="430" y1="264" x2="466" y2="264" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="448" y="256" font-size="9" fill="#57606a" text-anchor="middle" stroke="#ffffff" stroke-width="3" paint-order="stroke">多条 A 记录</text>

  <rect x="470" y="226" width="310" height="104" rx="8" fill="#fff8e6" stroke="#d4a72c" stroke-width="1.4"/>
  <text x="486" y="248" font-size="11" font-weight="700" fill="#7d4e00">无 VIP！直接返回所有 Ready 的 Pod IP</text>
  <g font-size="9" fill="#7d4e00">
    <rect x="486" y="258" width="278" height="18" rx="4" fill="#ffffff" stroke="#d4a72c"/>
    <text x="496" y="271">10.244.1.5</text>
    <rect x="486" y="280" width="278" height="18" rx="4" fill="#ffffff" stroke="#d4a72c"/>
    <text x="496" y="293">10.244.2.7</text>
    <rect x="486" y="302" width="278" height="18" rx="4" fill="#ffffff" stroke="#d4a72c"/>
    <text x="496" y="315">10.244.3.2</text>
  </g>

  <!-- FQDN anatomy -->
  <text x="40" y="376" font-size="10.5" fill="#57606a">完整域名（FQDN）的构成：</text>
  <g font-size="10.5" font-weight="600" text-anchor="middle">
    <rect x="40" y="386" width="180" height="34" rx="6" fill="#eff5ff" stroke="#326ce5" stroke-width="1.3"/>
    <text x="130" y="408" fill="#1f2328">nginx-clusterip</text>
    <rect x="228" y="386" width="100" height="34" rx="6" fill="#f0fff4" stroke="#2da44e" stroke-width="1.3"/>
    <text x="278" y="408" fill="#1f2328">default</text>
    <rect x="336" y="386" width="70" height="34" rx="6" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.3"/>
    <text x="371" y="408" fill="#1f2328">svc</text>
    <rect x="414" y="386" width="150" height="34" rx="6" fill="#f6f8fa" stroke="#8b949e" stroke-width="1.3"/>
    <text x="489" y="408" fill="#1f2328">cluster.local</text>
  </g>
  <g font-size="8.5" fill="#8b949e" text-anchor="middle">
    <text x="130" y="436">Service 名</text>
    <text x="278" y="436">命名空间</text>
    <text x="371" y="436">固定</text>
    <text x="489" y="436">集群域</text>
  </g>
  <text x="590" y="408" font-size="9.5" fill="#57606a">同 ns 内可直接用短名</text>

  <text x="40" y="472" font-size="10.5" fill="#1f2328">‣ StatefulSet 每个 Pod 另有独立域名：&lt;pod-ordinal&gt;.&lt;svc&gt;.&lt;ns&gt;.svc.cluster.local（如 web-0.nginx-headless）</text>
</svg>
