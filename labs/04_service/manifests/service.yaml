# =====================================================================
# Kubernetes Service 学习清单（04_service）
# 本文件包含 4 种 Service 类型 + 1 个被访问的后端 Deployment：
#   1. ClusterIP   —— 集群内部虚拟 IP（默认类型）
#   2. NodePort    —— 在每个节点上开一个端口（30000-32767）
#   3. LoadBalancer —— 云厂商分配外部 LB（NodePort 的超集）
#   4. Headless    —— clusterIP: None，直接解析到 Pod IP
# =====================================================================

---
# =====================================================================
# 0. 后端 Deployment：3 个 nginx Pod，作为所有 Service 的后端
#    注意 metadata.labels 必须与 Service 的 selector 匹配，
#    Service 才能通过 label 把流量转发到这些 Pod。
#    ★ 标签故意用 nginx-svc 而不是通用的 nginx：selector 匹配是 namespace 内全局的，
#      太通用的标签会把集群里其它 app=nginx 的 Pod 也拉进后端（经典生产事故）。
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy            # Deployment 名字
  labels:
    app: nginx-svc                  # Deployment 自身的 label（可选）
spec:
  replicas: 3                   # 3 个副本，用于观察负载均衡
  selector:
    matchLabels:
      app: nginx-svc                # Deployment 用它管理 Pod（必须匹配 template.labels）
  template:                     # Pod 模板
    metadata:
      labels:
        app: nginx-svc              # ★ Pod 的 label —— Service 的 selector 找的就是它
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine   # alpine 版本体积小，拉取快
          ports:
            - containerPort: 80      # 容器监听端口（仅声明作用）

---
# =====================================================================
# 1. ClusterIP Service（默认类型）
#    分配一个集群内部可路由的虚拟 IP（VIP），只能在集群内访问。
#    三个端口字段解释：
#      port       —— Service 暴露的端口（集群内访问用 service:port）
#      targetPort —— 后端容器实际监听的端口（Pod 里的 containerPort）
#      nodePort   —— ClusterIP 不需要它
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-clusterip         # 同时也是 DNS 名：nginx-clusterip.default.svc.cluster.local
spec:
  type: ClusterIP               # 默认类型，可省略
  selector:
    app: nginx-svc                  # ★ selector 匹配 Pod label → 自动生成 Endpoints
  ports:
    - name: http
      port: 80                  # Service 对外的端口（访问入口）
      targetPort: 80            # 转发到容器的 80 端口（可写容器内端口名）
      protocol: TCP

---
# =====================================================================
# 2. NodePort Service
#    在 ClusterIP 基础上，额外在每个节点上开一个静态端口（默认 30000-32767）。
#    外部客户端通过 <任意节点IP>:<nodePort> 访问。
#      port       —— 集群内访问端口
#      targetPort —— 容器端口
#      nodePort   —— 节点上对外暴露的端口（不写则自动分配）
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
spec:
  type: NodePort                # 关键区别
  selector:
    app: nginx-svc
  ports:
    - name: http
      port: 80                  # 集群内访问: nginx-nodeport:80
      targetPort: 80            # 容器端口
      nodePort: 30090           # 外部访问: <节点IP>:30090（可省略让它自动分配）

---
# =====================================================================
# 3. LoadBalancer Service
#    在 NodePort 之上，请求云厂商（GKE/EKS/AKS 等）创建一个外部负载均衡器，
#    云 LB 把流量导到各节点的 nodePort。本地 kind/minikube 环境中
#    EXTERNAL-IP 会一直是 <pending>（无云厂商实现）。
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-loadbalancer
spec:
  type: LoadBalancer            # 依赖云厂商的 LB controller
  selector:
    app: nginx-svc
  ports:
    - name: http
      port: 80                  # LB 监听的端口
      targetPort: 80            # 容器端口
      # nodePort 由 k8s 自动分配（LoadBalancer 内部包含 NodePort）

---
# =====================================================================
# 4. Headless Service（无头服务）
#    clusterIP: None → 不分配虚拟 IP，DNS 查询直接返回所有 Pod IP。
#    适用场景：StatefulSet（每个 Pod 需要独立 DNS 名）、
#             客户端自己做负载均衡（如 gRPC 长连接）、
#             主从选举类服务（需要直接连到具体某个 Pod）。
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
spec:
  clusterIP: None               # ★ Headless 的标志
  selector:
    app: nginx-svc
  ports:
    - name: http
      port: 80
      targetPort: 80
