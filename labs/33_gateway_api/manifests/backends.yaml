# 两个后端对所有路径返回固定响应 (版本号), 便于观察转发与权重
apiVersion: v1
kind: ConfigMap
metadata:
  name: route-v1-conf
data:
  default.conf: |
    server { listen 80; location / { return 200 "v1\n"; } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: route-v2-conf
data:
  default.conf: |
    server { listen 80; location / { return 200 "v2\n"; } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-v1
spec:
  replicas: 1
  selector:
    matchLabels: {app: route, version: v1}
  template:
    metadata:
      labels: {app: route, version: v1}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: conf
          configMap: {name: route-v1-conf}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: route-v2
spec:
  replicas: 1
  selector:
    matchLabels: {app: route, version: v2}
  template:
    metadata:
      labels: {app: route, version: v2}
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - name: conf
          configMap: {name: route-v2-conf}
---
apiVersion: v1
kind: Service
metadata:
  name: route-v1
spec:
  selector: {app: route, version: v1}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: route-v2
spec:
  selector: {app: route, version: v2}
  ports: [{port: 80, targetPort: 80}]
