# metadata:
#   name: allow-dns-egress
#   namespace: demo-netpol
# spec:
#   podSelector: {}                          # 所有 Pod 都要能查 DNS
#   policyTypes:
#     - Egress
#   egress:
#     - to:
#         - namespaceSelector:               # 按命名空间选: kube-system
#             matchLabels:
#               kubernetes.io/metadata.name: kube-system
#           podSelector:                     # 再按 Pod 选: kube-dns
#             matchLabels:
#               k8s-app: kube-dns
#       ports:                               # DNS 同时用 UDP 和 TCP 53
#         - protocol: UDP
#           port: 53
#         - protocol: TCP
#           port: 53
# ---
# --- 策略5(可选): 放行 frontend 出站访问 backend ---
