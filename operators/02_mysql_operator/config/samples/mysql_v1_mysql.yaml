# root 密码放 Secret，CR 只引用（密码不进 etcd/审计明文）
apiVersion: v1
kind: Secret
metadata:
  name: mysql-creds
stringData:
  password: "demo-root-pw"
---
apiVersion: mysql.example.com/v1
kind: MySQL
metadata:
  name: mysql-sample
spec:
  storageSize: 3Gi
  rootPasswordSecret:
    name: mysql-creds
    key: password
  backupSchedule: "*/2 * * * *"   # 演示：每 2 分钟备份一次
  backupRetentionDays: 7
