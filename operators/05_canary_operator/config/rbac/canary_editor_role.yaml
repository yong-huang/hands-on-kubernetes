# This rule is not used by the project canary-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the delivery.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: canary-operator
    app.kubernetes.io/managed-by: kustomize
  name: canary-editor-role
rules:
- apiGroups:
  - delivery.example.com
  resources:
  - canaries
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - delivery.example.com
  resources:
  - canaries/status
  verbs:
  - get
