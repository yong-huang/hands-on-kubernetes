# 项目 22 故障注入：四大 Pod 故障态（配合 verify-22.sh 使用）
# 恢复初始故障：kubectl delete ns broken && kubectl create ns broken && kubectl apply -f chaos-22.yaml
apiVersion: v1
kind: Pod
metadata: {name: bad-image, namespace: broken}
spec:
  containers: [{name: "app", image: "busybox:9.9.9-nonexist", command: ["sleep","3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: bad-cmd, namespace: broken}
spec:
  containers: [{name: "app", image: "busybox:1.36", command: ["/nonexistent-bin"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: stuck-pending, namespace: broken}
spec:
  nodeSelector: {gpu: a100}
  containers: [{name: "app", image: "busybox:1.36", command: ["sleep","3600"]}]
---
apiVersion: v1
kind: Pod
metadata: {name: oom-loop, namespace: broken}
spec:
  containers:
  - name: "app"
    image: busybox:1.36
    command: ["sh","-c","dd if=/dev/zero of=/dev/null bs=8M"]
    resources: {limits: {memory: "4Mi"}}
