# mini-mart · 订单服务部署清单（项目 2；项目 3 加热加载配置）
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: mart
data:
  config.json: |
    {"log_level": "INFO", "lookup_timeout_ms": 500}
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: mart
  labels:
    app: order
spec:
  type: NodePort
  selector:
    app: order
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30882
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: mart
  labels:
    app: order
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  progressDeadlineSeconds: 60
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        app: order
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: order-config
      containers:
        - name: order
          image: mart/order:0.4.0
          imagePullPolicy: IfNotPresent
          # 集群内走 Service DNS 名；NodePort 只给宿主机验收用
          env:
            - name: PRODUCT_ADDR
              value: product.mart.svc:50051
            - name: APP_VERSION
              value: "0.4.0"
            - name: KAFKA_ADDR
              value: kafka.mart.svc:9092
            - name: ORDER_DB_DSN
              value: postgres://order_user:orderpw@postgres.mart.svc:5432/orderdb
            - name: INVENTORY_ADDR
              value: inventory.mart.svc:8000
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: config
              mountPath: /etc/mart
              readOnly: true
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "3"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: "1"
              memory: 128Mi
