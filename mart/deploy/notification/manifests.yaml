# mini-mart · 通知服务（项目 5）：order.created 消费者
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: mart
  labels:
    app: notification
spec:
  type: NodePort
  selector:
    app: notification
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30883
---
# 单副本：幂等表在内存里，多副本会各查各的（项目 6 换共享存储后再扩）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: mart
  labels:
    app: notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
      labels:
        app: notification
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: notification
          image: mart/notification:0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_ADDR
              value: kafka.mart.svc:9092
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
